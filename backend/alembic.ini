# Alembic configuration for skawr-auth
# Consuming services should override sqlalchemy.url via SKAWR_AUTH_DATABASE_URL env var

[alembic]
# Path to migration scripts
script_location = skawr_auth/alembic

# sys path prepend for imports
prepend_sys_path = .

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision identifiers
truncate_slug_length = 40

# The default database URL - override via SKAWR_AUTH_DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://localhost/skawr_auth

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
